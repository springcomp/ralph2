schemaVersion: 1

workspace: ..
maxIterations: 100

tasks:
  format: markdown
  prd: .agentic/PRD.md
  progress: .agentic/progress.txt
  prompt: .agentic/ralph.prompt.md
  completionSignal: <ralph>COMPLETE</ralph>
  metadata:
    model: model
    agent: agent

defaults:
  harness: copilot
  model: gpt-5.6-luna
  agent: null
  statusFormat: "🔄️ Iteration {ITERATION:000} - {TYP}-{NUM} - {TASK} (model: `{MODEL}`)"

harnesses:
  copilot:
    executable: copilot
    arguments:
      - --yolo
      - --autopilot
      - --model
      - "{MODEL}"
      - --prompt
      - "Follow instructions from {PROMPT}"
    conditionalArguments:
      - whenSet: AGENT
        arguments:
          - --agent
          - "{AGENT}"
    timeout: 30m
    successExitCodes: [0]
    output:
      combined: .agentic/__agent.log
  pi:
    executable: pwsh
    arguments:
      - -NoLogo
      - -NoProfile
      - c:\users\maxim\appdata\local\pnpm\pi.ps1
      - --model
      - "{MODEL}"
      - --print
      - "Follow instructions from {PROMPT}"
    conditionalArguments: []
    timeout: 30m
    successExitCodes: [0]
    output:
      combined: .agentic/__agent.log

preAgent: []

postAgent:
  - name: build
    executable: node
    arguments:
      - "{WORKSPACE}/.agentic/scripts/build.cjs"
    timeout: 10m
    successExitCodes: [0]
    output:
      combined: .agentic/__build.log
    onFailure:
      action: scheduleTask
      task: "- [ ] FIX-{ITERATION:000} - Fix build failure from __build.log"

  - name: test
    executable: node
    arguments:
      - "{WORKSPACE}/.agentic/scripts/test.cjs"
    timeout: 20m
    successExitCodes: [0]
    output:
      combined: .agentic/__test.log
    onFailure:
      action: scheduleTask
      task: "- [ ] FIX-{ITERATION:000} - Fix unit tests failed from __test.log or improve coverage as per requirements"

  - name: commit
    executable: node
    arguments:
      - "{WORKSPACE}/.agentic/scripts/commit.cjs"
    timeout: 1m
    successExitCodes: [0]
    output:
      combined: .agentic/__commit.log
    onFailure:
      action: scheduleTask
      task: "- [ ] FIX-{ITERATION:000} - Do not leave changes uncommitted from __commit.log"

verification:
  requireTaskChecked: true
  retries: 1
  prompt: |
    Task: {TASK}

    Deterministic checks passed, but the task is still unchecked in PRD.
    Verify whether the work is complete. Check the task if complete, or document
    blockers in progress.txt.

continuation:
  kind: blueprint
  source: .agentic/BLUEPRINT.md
  seedPrdFromSource: true
  completeWhenSourceExhausted: true
